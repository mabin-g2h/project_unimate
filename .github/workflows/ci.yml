name: CI

# Runs on every pull request to main.
#  - "Checks" (tsc, lint, unit tests) always runs.
#  - "Playwright" runs only when app code changed, against a throwaway SCHEMA-ONLY Neon
#    branch (no student data) that is deleted when the job ends.
# Uses `pull_request` (never `pull_request_target`): PRs from forks get no secrets, so the
# Playwright job is skipped for them.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$files"
          # App code, tests, build/test config, dependencies, schema and this workflow.
          if echo "$files" | grep -Eq '^(app|lib|db|tests|public)/|^(middleware\.ts|next\.config\.ts|package\.json|package-lock\.json|tsconfig\.json|playwright\.config\.ts|vitest\.config\.ts|eslint\.config\.mjs|vercel\.json)$|^\.github/workflows/ci\.yml$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (tsc, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  playwright:
    name: Playwright (api, e2e, security)
    needs: changes
    # Skipped (counts as passed) for docs-only PRs and for fork PRs, which have no secrets.
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Throwaway SCHEMA-ONLY branch off the default (production) branch: tables exist, rows
      # do not, so no student data is ever copied. expires_at is a safety net in case the
      # delete step below never runs (e.g. the runner dies).
      - name: Compute branch name and expiry
        id: names
        run: |
          echo "branch=ci/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "expires=$(date -u -d '+3 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create Neon test branch (schema-only)
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ steps.names.outputs.branch }}
          branch_type: schema-only
          expires_at: ${{ steps.names.outputs.expires }}

      - name: Write .env.test
        env:
          DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DB_HOST: ${{ steps.neon.outputs.db_host_pooled }}
        run: |
          echo "::add-mask::$DB_URL"
          # Unquoted values: the harness parser does not strip quotes.
          cat > .env.test <<EOF
          TEST_MODE=1
          DATABASE_CONNECTION_STRING=$DB_URL
          TEST_DB_ALLOWED_HOSTS=$DB_HOST
          PROD_DB_HOST_MARKER=ep-red-queen-apffrdjy
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_EMAIL=admin@unimate.test,boot-admin@unimate.test
          APP_URL=http://localhost:3100
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          GMAIL_USER=test@unimate.test
          GMAIL_APP_PASSWORD=dummy
          STORAGE_DRIVER=local
          BLOB_READ_WRITE_TOKEN=
          CRON_SECRET=ci-cron-secret
          ACCOUNT_LIFESPAN_DAYS=30
          MAILPIT_API=http://127.0.0.1:8025
          RATE_LIMIT_IP_MAX=100000
          EOF

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8025/api/v1/info >/dev/null && exit 0
            sleep 2
          done
          echo "Mailpit did not start" && exit 1

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright suites
        run: npx playwright test
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Delete Neon test branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
